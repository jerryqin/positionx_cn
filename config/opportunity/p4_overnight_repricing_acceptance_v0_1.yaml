  expected_universe_panel_sha256: 'edbfc337f413d1d316d7bb1e9734873cb64ccee6d6743b106e97cd20a48ec38a'
  market_catalog: 'D:\positionx_data\catalog\market_data.duckdb'
  market_table: 'market.daily_bars_v1'

research_domain:
  include_suffixes: ['.SH', '.SZ']
  exclude_bse: true
  exclude_b_share: true
  eligible_keys: 'symbol x trade_date keys present in the frozen Opportunity Engine D2 panel'

mechanism:
  family: P4_OVERNIGHT_REPRICING
  name: TOP5PCT_POSITIVE_OPENING_GAP_ACCEPTANCE
  event_time: 'T OPEN'
  decision_time: 'T CLOSE'
  parent_event:
    definition: 'positive opening gap whose same-day cross-sectional percentile rank is >= 0.95'
    gap_formula: 'open(T) / pre_close(T) - 1'
    gap_rank: 'same-day percentile rank across eligible SH/SZ A-share keys'
  accepted:
    definition: 'low(T) > pre_close(T)'
    interpretation: 'overnight repricing remains unfilled for the whole session'
  rejected:
    definition: 'low(T) <= pre_close(T)'
    interpretation: 'overnight repricing is fully retraced intraday'
  comparison: 'accepted vs rejected within the same parent-event population'
  hypothetical_entry: 'T+1 OPEN'
  no_parameter_scan: true

price_adjustment:
  daily_factor: 'close / pre_close'
  adj_close: 'cumprod(daily_factor)'
  adj_open: 'adj_close * open / close'
  adj_high: 'adj_close * high / close'
  adj_low: 'adj_close * low / close'

labels:
  primary:
    name: P4_TREND25_60
    target: 0.25
    horizon_sessions: 60
    mae_floor: -0.10
  secondary:
    name: P4_TREND40_120
    target: 0.40
    horizon_sessions: 120
    mae_floor: -0.12
  evaluation_population: MATURED_ONLY

gate:
  selected_min: 200
  primary_lift_vs_rejected_min: 1.25
  primary_precision_minus_rejected_min: 0.03
  positive_years_min: 5
  pass_effect: mechanism survives to robustness only; NOT Strategy qualification

